<style>
  :root { --bg: #f4f2ec; --ink: #1c1b19; --muted: #77746c; --rule: #d9d5cb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141312; --ink: #eceae3; --muted: #8f8b82; --rule: #2e2c29; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Newsreader", Georgia, serif;
    font-size: 20px; line-height: 1.5;
    display: flex; align-items: center;
    padding: 0 24px;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 480px; margin: 0 auto; width: 100%; }
  h1 { font-weight: 400; font-size: 20px; }
  p { color: var(--muted); margin-top: 4px; }
  nav { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; gap: 24px; flex-wrap: wrap; }
  a { color: var(--ink); text-decoration: none; }
  a:hover { color: var(--muted); }
  a:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <h1>Eliot Chang</h1>
  <p>I am a designer with a background in computer science and behavioral economics looking to make intuitive, beautiful, and fun products.</p>

  </nav>
</main>
