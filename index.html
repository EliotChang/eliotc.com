<style>
  * { box-sizing: border-box; }
  html { background: #111110; -webkit-font-smoothing: antialiased; }
  body {
    margin: 0; min-height: 100vh; min-height: 100svh; background: #111110; color: #9e9d97;
    font: 16px/1.65 "Instrument Sans", system-ui, sans-serif; letter-spacing: -0.005em;
    display: grid; place-items: center; padding: 48px 24px;
  }
  main { max-width: 100%; }
  h1 { margin: 0; font: 400 34px/1.1 "Instrument Serif", Georgia, serif; color: #efeee9; }
  p { margin: 0; color: #efeee9; font-size: 17px; }
  .prev { margin-top: 32px; }
  .label { display: block; font-size: 13px; color: #6f6e69; margin-bottom: 4px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li::before { content: "–"; color: #55544f; margin-right: 10px; }
  nav { display: flex; gap: 24px; margin-top: 40px; font-size: 15px; }
  a { color: #efeee9; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: rgba(239,238,233,.3); transition: text-decoration-color .2s; }
  a:hover { text-decoration-color: rgba(239,238,233,.9); }
  a:focus-visible { outline: 1px solid #efeee9; outline-offset: 3px; }
  .in { opacity: 0; filter: blur(3px); transform: translateY(4px); animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
  .in:nth-child(2) { animation-delay: .1s; } .in:nth-child(3) { animation-delay: .2s; }
  @keyframes in { to { opacity: 1; filter: none; transform: none; } }
  @media (max-width: 480px) { br { display: none; } body { padding: 48px 16px; } }
  @media (prefers-reduced-motion: reduce) { .in { animation: none; opacity: 1; filter: none; transform: none; } }
</style>
</head>
<body>
<main>
  <p class="in">Hi! I’m Eliot, a designer working on<br> real-time generated interactive media.</p>
  <div class="in prev">

      <li>a16z speedrun</li>

    <a href="https://www.linkedin.com/in/eliot-chang/">LinkedIn</a>
    <a href="mailto:me@eliotc.com">Email</a>
  </nav>
</main>
</body>
</html>
